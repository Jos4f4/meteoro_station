<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica - Fametro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="header-container">
            <div class="logo-area">
                <img src="src\image\fametro_logo.jpg" alt="Logo Fametro" class="fametro-logo" onerror="this.style.display='none'">
            </div>
            <div class="title-area">
                <h1>Estação Meteorológica IoT</h1>
                <p class="class-info">Turma de Sistemas de Informação - 7° Período (SIS232N01)</p>
            </div>
        </header>

        <main class="dashboard">
            <h2>Estação - Agora</h2>
            <p id="status-time" class="status-time">Aguardando dados...</p>
            
            <div class="csv-download">
                <a href="/api/exportar.csv" class="btn-download">Descarregar Histórico CSV</a>
            </div>

            <div class="cards-grid">
                <div class="card">
                    <h3>Temperatura</h3>
                    <p id="temp-value" class="metric-value">-- °C</p>
                </div>
                <div class="card">
                    <h3>Umidade</h3>
                    <p id="hum-value" class="metric-value">-- % UR</p>
                </div>
                <div class="card">
                    <h3>Qualidade do Ar</h3>
                    <p id="air-value" class="metric-value">-- Índice</p>
                    <div>
                        <span id="air-category" class="category-badge">--</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
</body>
</html>
